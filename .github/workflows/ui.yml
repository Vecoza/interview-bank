name: UI

on:
  push:
    branches: [main]
    paths:
      - "interview-bank-ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "interview-bank-ui/**"
      - ".github/workflows/ui.yml"

defaults:
  run:
    working-directory: interview-bank-ui

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: interview-bank-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build -- --configuration production

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Skip when Vercel is not configured
        if: env.VERCEL_TOKEN == ''
        working-directory: .
        run: echo "::notice::VERCEL_TOKEN secret is not set, skipping deploy."

      - uses: actions/checkout@v5
        if: env.VERCEL_TOKEN != ''

      - name: Setup Node
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel
          vercel --prod --yes --token="$VERCEL_TOKEN"
