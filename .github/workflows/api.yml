name: API

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "InterviewBank.slnx"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "InterviewBank.slnx"
      - "Dockerfile"
      - ".github/workflows/api.yml"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore InterviewBank.slnx

      - name: Build
        run: dotnet build InterviewBank.slnx --no-restore -c Release

      # Integration tests start PostgreSQL in Docker via Testcontainers
      - name: Test
        run: dotnet test InterviewBank.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults

      - name: Docker image builds
        run: docker build -t interview-bank-api .

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Skip when Fly.io is not configured
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN secret is not set, skipping deploy."

      - uses: actions/checkout@v5
        if: env.FLY_API_TOKEN != ''

      - name: Setup flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
