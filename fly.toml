app = "interview-bank-api"
primary_region = "iad"

[build]

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS        = "http://+:8080"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "20s"
    interval     = "30s"
    timeout      = "5s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size = "shared-cpu-1x"
